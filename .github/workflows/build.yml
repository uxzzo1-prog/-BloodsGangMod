name: Build Bloods Gang Mod .so

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b
          add-to-path: true

      - name: Prepare Build Environment
        run: |
          git clone --depth=1 https://github.com/rusjj/AML-SDK.git aml_sdk
          mkdir -p jni
          # نسخ الملفات من المجلد الرئيسي للمستودع إلى مجلد jni للترجمة
          cp main.cpp jni/
          cp Android.mk jni/
          echo "APP_ABI := armeabi-v7a" > jni/Application.mk
          echo "APP_PLATFORM := android-21" >> jni/Application.mk
          echo "LOCAL_C_INCLUDES += \$(LOCAL_PATH)/../aml_sdk/include" >> jni/Android.mk

      - name: Build Shared Library (.so)
        run: |
          ndk-build -C jni

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: libBloodsGang.so
          path: jni/libs/armeabi-v7a/libBloodsGang.so
